id: scenario_free_city_awakening
name: 自由之都與荒野甦醒
description: 你是荒野遺孤，在一次重傷高燒中昏迷於荒涼死地。幸運的是，一支前往著名「自由城邦·奧斯提亞」的商隊發現了你，將你帶上大篷車救入城中。在城邦客棧中甦醒時，你的眼眸中浮現出了世間萬物的浮光詞條……
